{% extends 'base-crud.html' %}
{% block title %}Alterar Paciente{% endblock %}
{% load static %}
{% block content %}
<h1 class="mt-5">
    Alterar dados do Paciente
</h1>
<hr>
{% if error %}<p>{{ error }}</p>{% endif %}
<form action="{% url 'alterar_paciente' paciente.codigo_paciente %}" method="POST">
    {% csrf_token %}
    <div class="row">
        <div class="col-12 col-md-8 col-lg-6 mb-3">
            <!-- <label for="nome" class="form-label"> -->
                
                <!-- Nome -->
                <div class="mb-4">
                    <label for="nome" class="form-label fw-semibold">
                        <i class="bi bi-person me-1 text-primary"></i>
                        Nome do Paciente
                    </label>
                    <input type="text" class="form-control form-control-lg" id="nome" name="nome" value="{{ paciente.nome }}" required>
                </div>


                <div class="row">
                    <!-- CPF -->
                    <div class="col-md-6 mb-4">
                        <label for="cpf" class="form-label fw-semibold">
                            <i class="bi bi-card-text me-1 text-primary"></i>
                            CPF
                        </label>
                        <input type="text" class="form-control form-control-lg" id="cpf" name="cpf" placeholder="000.000.000-00" value=" {{ paciente.cpf }}" required>
                    </div>


                    <!-- Telefone -->
                    <div class="col-md-6 mb-4">
                        <label for="telefone" class="form-label fw-semibold">
                            <i class="bi bi-telephone me-1 text-primary"></i>
                            Telefone
                        </label>

                        <input type="tel" class="form-control form-control-lg" id="telefone" name="telefone" placeholder="(00) 00000-0000" value="{{ paciente.telefone }}" required>
                    </div>
                </div>


                <div class="row">
                    <!-- E-mail -->
                    <div class="col-md-7 mb-4">
                        <label for="email" class="form-label fw-semibold">
                            <i class="bi bi-envelope me-1 text-primary"></i>
                            E-mail
                        </label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email" value="{{ paciente.email }}" required>
                    </div>


                    <!-- Data de nascimento -->
                    <div class="col-md-5 mb-4">
                        <label for="data_nascimento" class="form-label fw-semibold">
                            <i class="bi bi-calendar-event me-1 text-primary"></i>
                            Data de Nascimento
                        </label>
                        <input type="date" class="form-control form-control-lg" id="data_nascimento" name="data_nascimento" placeholder="DD/MM/AAAA" value="{{ paciente.data_nascimento|date:'Y-m-d' }}" required>
                    </div>
                    <div class="col-md-5 mb-4">
                        <label for="sintomas" class="form-label fw-semibold">
                            <i class="bi bi-text me-1 text-primary"></i>
                            Sintomas
                        </label>
                        <input type="text" class="form-control form-control-lg" id="sintomas" name="sintomas"  value="{{ paciente.sintomas }}" required>
                    </div>
                </div>
                <div class="row">
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">
                            Alterar
                        </button>
                    </div>
                </div>
</form>
<script src="{% static 'js/script.js' %}"></script>
{% endblock %}
