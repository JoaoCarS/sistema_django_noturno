<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="author" content="João Carlos da Conceição Silva">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title%}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  </head>
  <body>
    {% include 'includes/header.html' %}
    <main class="container vh-100">
        {% block content %}{% endblock %}
    </main>
    {% include 'includes/footer.html' %}
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
<style>
    /* Cabeçalho azul */
    .tabela-pacientes thead th {
        background-color: #0d6efd;
        color: white;
        padding: 15px;
        border-color: #0b5ed7;
        white-space: nowrap;
    }

    /* Linhas alternadas em azul-claro */
    .tabela-pacientes tbody tr:nth-child(odd) > td {
        background-color: #eaf3ff;
    }

    .tabela-pacientes tbody tr:nth-child(even) > td {
        background-color: #ffffff;
    }

    /* Efeito ao passar o mouse */
    .tabela-pacientes tbody tr:hover > td {
        background-color: #cfe2ff;
        transition: background-color 0.2s ease;
    }

    /* Espaçamento e alinhamento */
    .tabela-pacientes tbody td {
        padding: 12px 15px;
        vertical-align: middle;
    }

    /* Botões arredondados */
    .tabela-pacientes .btn {
        border-radius: 6px;
    }

    /* Caixa da tabela */
    .tabela-pacientes-container {
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid #cfe2ff;
    }

    /* Impede a quebra de linha no CPF e telefone */
    .tabela-pacientes th:nth-child(3),
    .tabela-pacientes td:nth-child(3),
    .tabela-pacientes th:nth-child(5),
    .tabela-pacientes td:nth-child(5) {
    white-space: nowrap;
}
</style>
</html>
